<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creature Chronicles — Developer viewport preview</title>
<style>*{box-sizing:border-box}body{margin:0;background:#202529;color:#f7efd9;font:14px system-ui,sans-serif}header{height:62px;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px}label{display:flex;gap:8px;align-items:center}select,a{font:inherit;padding:7px 10px;border:1px solid #9b8b6e;border-radius:6px;background:#fff1d5;color:#302518}main{display:flex;justify-content:center;align-items:flex-start;padding:0 12px 12px}iframe{display:block;width:390px;height:844px;flex:none;border:1px solid #786b52;background:#171c20}a{text-decoration:none}small{color:#cdc6b6}@media(max-width:750px){header{height:auto;flex-wrap:wrap}small{display:none}}</style></head>
<body><header><strong>Developer viewport preview</strong><label>Viewport<select id="viewport" aria-label="Viewport"><option value="390,844">Phone · 390 × 844</option><option value="360,640">Compact phone · 360 × 640</option><option value="844,390">Landscape · 844 × 390</option><option value="1024,768">Tablet · 1024 × 768</option></select></label><a href="/">Open game</a><small>Live game in a sized frame · uses this browser’s save</small></header><main><iframe id="game" title="Creature Chronicles live viewport" src="/" width="390" height="844"></iframe></main>
