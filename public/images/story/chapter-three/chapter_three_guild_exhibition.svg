<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Regional Guild Exhibition</title>
  <desc id="desc">A lantern-lit exhibition platform with guild banners, a ranch handler, and a creature before a watching crowd.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#183849"/>
      <stop offset="0.58" stop-color="#31586a"/>
      <stop offset="1" stop-color="#a56845"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f4b31"/>
      <stop offset="1" stop-color="#2d211c"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9aa4e"/>
      <stop offset="1" stop-color="#8e3f36"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#ffe7a3" stop-opacity=".82"/>
      <stop offset="1" stop-color="#ffe7a3" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#sky)"/>
  <circle cx="600" cy="250" r="290" fill="url(#spot)"/>
