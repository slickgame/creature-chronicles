<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">The Patron Circuit</title>
  <desc id="desc">Three sealed invitations representing the Guild Registry, Petra's Builder's Yard, and the Rose Lantern.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172a36"/>
      <stop offset="0.55" stop-color="#44322d"/>
      <stop offset="1" stop-color="#20141d"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#815736"/>
      <stop offset="1" stop-color="#3d251a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="url(#sky)"/>
  <circle cx="170" cy="130" r="105" fill="#d8ad68" opacity=".12"/>
  <circle cx="1030" cy="120" r="145" fill="#d94f71" opacity=".10"/>
  <path d="M0 500 Q270 420 520 500 T1200 475 V700 H0Z" fill="#11191d" opacity=".8"/>
  <rect x="85" y="300" width="1030" height="350" rx="26" fill="url(#table)" stroke="#d3a45d" stroke-opacity=".45" stroke-width="5"/>
  <g filter="url(#shadow)">
    <g transform="translate(130 185) rotate(-7 155 175)">
      <rect width="310" height="350" rx="18" fill="#e9dfc5" stroke="#d0a95d" stroke-width="7"/>
      <path d="M0 0 L155 142 L310 0" fill="#d8caa8"/>
      <circle cx="155" cy="205" r="50" fill="#2e5472" stroke="#d0a95d" stroke-width="7"/>
      <path d="M127 206 h56 M155 178 v56" stroke="#e9dfc5" stroke-width="10" stroke-linecap="round"/>
      <text x="155" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#263544">REGISTRY</text>
    </g>
    <g transform="translate(445 160)">
      <rect width="310" height="365" rx="18" fill="#ead5ac" stroke="#d0a95d" stroke-width="7"/>
      <path d="M0 0 L155 148 L310 0" fill="#c99d61"/>
      <circle cx="155" cy="214" r="51" fill="#7c4d2f" stroke="#f0cb7f" stroke-width="7"/>
      <path d="M125 234 L184 175 M137 173 L190 226" stroke="#f2d89f" stroke-width="14" stroke-linecap="round"/>
      <text x="155" y="312" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#4c2d1e">PETRA</text>
    </g>
    <g transform="translate(760 185) rotate(7 155 175)">
      <rect width="310" height="350" rx="18" fill="#ead9df" stroke="#d0a95d" stroke-width="7"/>
      <path d="M0 0 L155 142 L310 0" fill="#cda8b7"/>
      <circle cx="155" cy="205" r="50" fill="#8c3555" stroke="#f0c77a" stroke-width="7"/>
      <path d="M155 168 C126 190 127 226 155 244 C183 226 184 190 155 168Z" fill="#f2d6a0"/>
      <circle cx="155" cy="207" r="12" fill="#8c3555"/>
      <text x="155" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#5a2940">ROSE LANTERN</text>
    </g>
  </g>
  <text x="600" y="85" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-weight="700" fill="#f4ddb0">THE PATRON CIRCUIT</text>
  <text x="600" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#e2c99d">Three invitations. One permanent charter.</text>
</svg>
