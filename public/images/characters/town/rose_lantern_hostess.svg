<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="title desc">
  <title id="title">Rose Lantern hostess placeholder</title>
  <desc id="desc">Stylized adult woman in an elegant burgundy evening dress standing beneath a rose lantern.</desc>
