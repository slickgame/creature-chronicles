<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creature Chronicles — Apothecary asset preview</title><link rel="stylesheet" href="components.css"><style>
*{box-sizing:border-box}body{margin:0}main{height:100dvh;padding:14px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px}header,nav,footer{display:flex;align-items:center;justify-content:space-between;gap:8px}h1,h2,p{margin:0}h1{font-size:24px}.heading{background:#f8eacb;padding:6px 18px;border:1px solid #a78a55}button{font-size:15px!important}.stage{min-height:0;display:grid;align-items:center;grid-template-columns:1fr 1fr;gap:24px}.display{position:relative;height:100%;min-height:0}.plinth{position:absolute;width:100%;bottom:5%;height:42%;object-fit:contain}.hero{position:absolute;width:85%;left:7%;height:65%;bottom:22%;object-fit:contain}.sheet{display:grid;gap:14px;max-height:100%}.sheet h2{font-size:25px}.vital{padding:10px;background:#e4e9c9;border:1px solid #b49c6f}.recipient{display:flex;gap:14px;align-items:center;text-align:left}.recipient img{width:72px;height:72px;object-fit:cover}.sheet>.control{width:100%}.gridview{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:10px;min-height:0;max-width:1120px;width:100%;height:100%;margin:auto}.cards{min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.cards .card{display:grid;grid-template-rows:minmax(0,1fr) auto auto;text-align:center;min-height:0}.card .pick{border:0;background:transparent;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;cursor:pointer}.pick img{height:100%;width:100%;object-fit:contain;min-height:0}.tools{display:flex;gap:8px;align-items:center}.tools input{min-width:0;width:100%;background:#f5e7c9;border:1px solid #b19b6d;padding:4px}.title-banner{background:url('title-banner.webp') center/100% 240% no-repeat;min-height:54px;display:grid;place-items:center;padding:8px 28px}.muted{font:12px Arial,sans-serif}.category{display:flex;gap:4px;flex-wrap:wrap}.category button{min-height:32px}.portrait .pick img{object-fit:cover}.info{font:700 19px Georgia!important;min-height:44px!important;min-width:44px!important;width:44px;height:44px}.hidden{display:none!important}dialog{border:0;padding:0;background:transparent;max-width:min(90vw,600px);color:#3e2b19}dialog::backdrop{background:#241909b3;backdrop-filter:blur(4px)}.detail-body{display:grid;gap:12px}.detail-body img{height:150px;width:150px;object-fit:cover;justify-self:center}.small-art .display{display:none}.small-art .stage{grid-template-columns:minmax(0,650px);justify-content:center}.badge{font:14px Arial,sans-serif}header nav{flex-wrap:wrap;justify-content:flex-end}
@media(max-width:650px){main{padding:8px;gap:6px}header{flex-wrap:wrap}h1{font-size:18px}header nav{width:100%;justify-content:center}button{font-size:12px!important}.stage{grid-template-columns:1fr;grid-template-rows:100px minmax(0,1fr);gap:6px}.display{height:100px}.plinth{height:60px;bottom:0}.hero{height:100px;bottom:15px}.sheet{gap:6px}.sheet h2{font-size:20px}.recipient img{width:44px;height:44px}.vital{padding:6px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.gridview{gap:6px}.tools{flex-wrap:wrap}.category button{font-size:10px!important;padding:0 3px!important}.small-art .stage{grid-template-rows:1fr}.title-banner{min-height:42px}footer button{padding:0 4px!important}.sheet .divider{height:10px}}
@media(max-height:550px){main{padding:6px;gap:6px}header h1{font-size:17px}.control{min-height:30px!important;font-size:11px!important}.sheet{gap:4px}.sheet h2{font-size:18px}.sheet .divider{display:none}.recipient img{height:35px;width:35px}.vital{padding:4px}.gridview{gap:4px}.title-banner{min-height:30px}h2{font-size:18px}.category button{min-height:26px!important}.badge{font-size:11px}.info{width:44px;height:44px;min-height:44px!important;min-width:44px!important}.tools input{min-height:28px}.detail-body{gap:6px}.detail-body img{height:70px;width:70px}}
@media(max-height:550px){.stage{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}.sheet{grid-template-columns:repeat(2,minmax(0,1fr));border-width:12px;padding:4px}.sheet>.title-banner,.sheet>footer{grid-column:1/-1}.sheet>p{font-size:11px}.sheet>.recipient{grid-column:2}.sheet>.vital{grid-column:1}.sheet>.primary{grid-column:2}}
@media(max-width:650px) and (min-height:551px) and (max-height:800px){.stage{grid-template-rows:70px minmax(0,1fr)}.display{height:70px}.hero{height:70px}.plinth{height:40px}.sheet{gap:4px}}
</style><body class="apothecary"><main><header><h1 class="heading">Inventory · Asset preview</h1><nav><button class="control" data-view="detail">Item detail</button><button class="control" data-view="recipients">Choose recipient</button><button class="control" data-view="items">Browse items</button></nav></header><section id="view" class="stage"></section></main><dialog id="info"><div class="panel detail-body" id="character-card"></div></dialog><script>
const items=[['energy-snack','Energy Snack',5,'Restores 12 Energy.'],['energy-meal','Hearty Energy Meal',2,'Restores 30 Energy.'],['affection-treat','Affection Treat',3,'Adds 8 Affection to one creature.'],['recovery-balm','Recovery Balm',1,'Restores 1 Heart and shortens an active injury by 1 day.'],['fertility-tonic','Fertility Tonic',2,'Arms a bonus for the next valid attempt.'],['trait-stabilizer','Trait Stabilizer',1,'Arms inheritance support for successful conception.'],['mutation-catalyst','Mutation Catalyst',1,'Arms mutation support for successful conception.'],['gestation-tonic','Gestation Tonic',0,'Shortens an active pregnancy by 1 day, never below 1 day.']];
let people=[{"id":"player","name":"Inspect review","art":"/images/ui/icons/icon_breeder_level.png","energy":500,"maxEnergy":500,"hearts":4,"maxHearts":4,"family":"Player"},{"id":"parent_0","name":"Worker 001","art":"/images/creatures/feline/nyla/nyla_02_bust_portrait.png","energy":91,"maxEnergy":91,"hearts":4,"maxHearts":4,"family":"Base Feline Feline"},{"id":"parent_1","name":"Worker 002","art":"/images/creatures/canine/daisy/daisy_02.webp","energy":100,"maxEnergy":100,"hearts":5,"maxHearts":5,"family":"Base Canine Canine"},{"id":"parent_2","name":"Worker 003","art":"/images/creatures/bovine/cow_portrait.png","energy":108,"maxEnergy":108,"hearts":5,"maxHearts":5,"family":"Cow Bovine"},{"id":"parent_3","name":"Worker 004","art":"/images/creatures/lapine/gameplay/lapine_02.webp","energy":84,"maxEnergy":84,"hearts":4,"maxHearts":4,"family":"Bunny Lapine"},{"id":"parent_4","name":"Worker 005","art":"/images/creatures/equine/gameplay/equine_02_bust_portrait.png","energy":117,"maxEnergy":117,"hearts":5,"maxHearts":5,"family":"Horse Equine"}],selected=0,recipient=1,current='detail',page=0,search='',category='All';const view=document.querySelector('#view'),info=document.querySelector('#info');const art=(n)=>n+'.webp',capacity=()=>innerWidth<650?4:8;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(name){current=name;page=0;render();}function render(){view.className=current==='detail'?'stage':'panel gridview';const item=items[selected],p=people[recipient];if(current==='detail'){view.innerHTML=`<div class="display"><img class="plinth" src="display-plinth.webp" alt=""><img class="hero" src="${art(item[0])}" alt="${item[1]}"></div><article class="panel sheet"><div class="title-banner"><h2>${item[1]}</h2></div><button class="control" onclick="show('items')">Browse items</button><p>Owned: ${item[2]}</p><div class="divider"></div><p>${item[3]}</p><button class="control recipient" onclick="show('recipients')"><img src="${p.art}" alt=""><span>Recipient<br><strong>${esc(p.name)}</strong> · Change</span></button>${selected<2?`<p class="vital">Energy ${p.energy} → ${Math.min(p.maxEnergy,p.energy+(selected===0?12:30))}</p>`:`<p class="vital">Review the item’s target and effect before use.</p>`}<button class="control primary" disabled>Use Item · preview only</button><footer><button class="control">Find source</button><button class="control">Armed effects: 1</button><button class="control" onclick="document.body.classList.toggle('small-art')">Minimize art</button></footer><footer><button class="control" onclick="selected=(selected+7)%8;render()">‹ Previous</button><span>${selected+1} / 8</span><button class="control" onclick="selected=(selected+1)%8;render()">Next ›</button></footer></article>`;return;}
const choosing=current==='recipients',list=choosing?people:category==='All'||category==='Consumables'?items:[],filtered=list.map((x,i)=>({x,i})).filter(({x})=>(choosing?x.name:x[1]).toLowerCase().includes(search.toLowerCase())),cap=capacity(),pages=Math.max(1,Math.ceil(filtered.length/cap));page=Math.min(page,pages-1);view.innerHTML=`<header><h2>${choosing?'Choose recipient':'Browse items'}</h2><button class="control" onclick="show('detail')">Close ×</button></header><section class="tools"><input aria-label="Search" placeholder="Search ${choosing?'name':'items'}" value="${esc(search)}" oninput="search=this.value;page=0;render();document.querySelector('[aria-label=Search]').focus()">${!choosing?'<nav class="category">'+['All','Consumables','Equipment','Materials','Key items'].map(c=>`<button class="control ${category===c?'primary':''}" onclick="category='${c}';page=0;render()">${c}</button>`).join('')+'</nav>':'<span class="badge">All recipients · portrait info stays separate</span>'}</section><section class="cards ${choosing?'portrait':''}">${filtered.slice(page*cap,(page+1)*cap).map(({x,i})=>`<article class="card" aria-selected="${i===(choosing?recipient:selected)}"><button class="pick" title="${esc(choosing?x.family:x[3])}" onclick="${choosing?'recipient':'selected'}=${i};search='';show('detail')"><img src="${choosing?x.art:art(x[0])}" alt=""><strong>${esc(choosing?x.name:x[1])}</strong></button><span class="badge">${choosing?`Energy ${x.energy}/${x.maxEnergy}`:'× '+x[2]}</span>${choosing?`<button class="info" aria-label="Details for ${esc(x.name)}" onclick="details(${i})"><span class="icon" aria-hidden="true"></span></button>`:''}</article>`).join('')||'<p>No items in this preview category.</p>'}</section><footer><button class="control" onclick="show('detail')">Cancel</button><button class="control" ${page===0?'disabled':''} onclick="page--;render()">‹ Previous</button><span>${page+1} / ${pages}</span><button class="control" ${page===pages-1?'disabled':''} onclick="page++;render()">Next ›</button></footer>`;}
function details(i){const p=people[i];document.querySelector('#character-card').innerHTML=`<header><h2>${esc(p.name)}</h2><button class="control" onclick="info.close()">Close details</button></header><img src="${p.art}" alt="${esc(p.name)}"><p>${esc(p.family)}</p><p>Energy ${p.energy}/${p.maxEnergy} · Hearts ${p.hearts}/${p.maxHearts}</p><p class="muted">Read-only character-card preview. Closing returns to the same recipient page without selecting a recipient.</p>`;info.showModal();}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{search='';show(b.dataset.view)});addEventListener('resize',render);render();
</script></body></html>
