const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const B=(text,action='',cls='',disabled=false)=>`<button ${disabled?'disabled':''} class="${cls}" ${action?`onclick="${action}"`:''}>${text}</button>`;const P=()=>M.participants;const parent=id=>M.participants.find(p=>p.participantId===id)||M.giver;const img=p=>p.kind==='player'?'':p.profilePath||'';const portrait=(p,role)=>`<div class="hero">${img(p)?`<img src="${img(p)}" alt="${E(p.displayName)} complete profile">`:`<div class="playerBadge">Rancher<br><small>No registered profile</small></div>`}<div class="nameplate"><h2>${E(p.displayName)} · ${role}</h2><small>Level ${p.level} · Ready</small></div></div>`;const mini=(p,role)=>`<div class="miniParent">${img(p)?`<img src="${img(p)}" alt="${E(p.displayName)} profile">`:`<span class="playerBadge">Rancher</span>`}<div><small>${role} · Level ${p.level}</small><br><strong>${E(p.displayName)}</strong><p>Energy ${p.energy}/${p.maxEnergy} · Hearts ${p.hearts}/${p.maxHearts}</p></div></div>`;const pair=()=>`<div class="parentPair">${portrait(M.giver,'Giver')}${portrait(M.receiver,'Receiver')}</div>`;const tabs=(names)=>`<nav class="sectionTabs">${names.map(t=>`<button aria-pressed="${tab===t}" onclick="setTab('${t}')">${t}</button>`).join('')}</nav>`;const table=(headers,rows)=>`<table class="table"><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>`<td ${i?'class="num"':''}>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;const costs=()=>table(['Parent','Energy','Hearts'],[M.giver,M.receiver].map(p=>[`${E(p.displayName)}<br><small>${p===M.giver?'Giver':'Receiver'}</small>`,`${p.energy} <span class="costArrow">→</span> ${p.energy-M.preview.energyCost}`,`${p.hearts} <span class="costArrow">→</span> ${p.hearts-M.preview.heartCost}`]));const pager=(text='1 / 1',compact=false)=>`<div class="pager">${B(compact?'‹':'‹ Previous',"show('Preview page change function inspect(){const p=parent(inspectedId);let content='';if(tab==='Overview')content=`<span class="status">Ready · No active injury</span><div class="stats">${[['Energy',`${p.energy}/${p.maxEnergy}`],['Hearts',`${p.hearts}/${p.maxHearts}`],['Affection',`${p.affection}/100`],['Level',p.level],['Experience',`${p.xp}/${p.xpToNext}`],['Role','Giver']].map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join('')}</div><div class="note">${E(p.description)}</div><p class="muted">View availability, origin and recorded parents from the profile tabs.</p>`;else if(tab==='Stats')content=table(['Base stat','Value','Innate grade'],Object.entries(STATS).map(([k,name])=>[name,p.stats[k],p.statGrades?.[k]??'—']))+`<p class="note">Base creature stats. Equipment remains separate. Existing next-level growth details stay available.</p>`;else if(tab==='Talents')content=p.abilities.map(a=>`<div class="inset"><h3>${E(a.name)} · ${a.grade}</h3><p>${E(a.description)}</p></div>`).join('');else if(tab==='Lineage')content=`<h3>Recorded family</h3><div class="note">Starter parent links are not recorded. No invented ancestors or inheritance results are shown.</div>${B('Open family record',"go('ledger')")}<p>Generation and permanent lineage markers stay available in the full record.</p>`;else content=`<h3>Farm & domestic skills</h3><p class="note">Instant work uses creature Energy, with no Gold operating cost.</p><div class="row"><span>Farm skills</span>${B('Skill details',"show('Existing skill levels, XP and aptitude remain available as focused pages.')")}</div><div class="row"><span>Domestic skills</span><small>Reserved systems remain labelled</small></div>`;
return `<section class="workspace inspect" data-focus="${focus}"><aside class="hero" data-pane="lead">${img(p)?`<img src="${img(p)}" alt="${E(p.displayName)} full-body profile">`:`<div class="playerBadge">Rancher · No registered full-body profile</div>`}<div class="nameplate"><h2>${E(p.displayName)}</h2><small>${E(p.familyLabel)} · Level ${p.level}</small></div></aside><article class="panel" data-pane="detail"><div class="kicker">Parent dossier · Read only</div><h2>${E(p.displayName)}</h2>${tabs(['Overview','Stats','Work','Talents','Lineage'])}<div class="content">${content}</div>${pager(tab==='Overview'?'1 / 4':'Focused record')}<footer class="actions">${B('Back to pairing desk',"show('Returns to the same giver, receiver and source window.')",'primary')}</footer></article></section>`}
function change(){const p=parent(candidate);const selectable=p.participantId!==M.receiver.participantId&&p.roleTags.includes('giver');const detail=`<article class="panel" data-pane="detail"><div class="kicker">Draft giver selection</div><h2>${E(p.displayName)}</h2>${mini(p,'Candidate')}<div class="stats">${[['Energy',`${p.energy}/${p.maxEnergy}`],['Hearts',`${p.hearts}/${p.maxHearts}`],['Affection',p.affection]].map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join('')}</div><p class="note ${selectable?'good':'warn'}">${selectable?'Eligible role. Selecting changes the draft pair only.':'This candidate cannot occupy this role alongside the selected receiver.'}</p><p>Receiver kept: <strong>Mira</strong></p>${B('Inspect candidate',"inspectedId=candidate;go('inspect')")}<footer class="actions">${B('Cancel',"show('Selection cancelled. The live pair is unchanged.')")}${B('Select giver',"show('Preview selection applied to this mockup only. The live pair is unchanged.')",'primary',!selectable)}</footer></article>`;const cards=P().map(p=>mode==='a'?`<button class="tile" aria-pressed="${p.participantId===candidate}" onclick="choose('${p.participantId}')">${img(p)?`<img src="${img(p)}" alt="${E(p.displayName)} full-body profile">`:`<div class="playerBadge">Rancher<small>Player</small></div>`}<strong>${E(p.displayName)}</strong><small>Level ${p.level} · ${p.participantId===M.receiver.participantId?'Selected receiver':p.kind==='player'?'Player':p.roleTags.includes('giver')?'Giver':'Receiver'}</small></button>`:`<button aria-pressed="${p.participantId===candidate}" onclick="choose('${p.participantId}')">${img(p)?`<img src="${img(p)}" alt="${E(p.displayName)} profile">`:`<div class="playerBadge">Player</div>`}<strong>${E(p.displayName)}</strong><small>Level ${p.level}</small></button>`).join('');return `<section class="workspace gallery change" data-focus="${focus}"><article class="panel" data-pane="lead"><h2>${mode==='a'?'Choose a giver':'Parents'}</h2><input aria-label="Search parents" placeholder="Search parents" oninput="show('Search and existing filters will use the ranch roster.')"><div class="${mode==='a'?'grid':'list'}">${cards}</div>${pager(mode==='a'?'1 / 1 · 5 creatures + player':'1 / 1',mode==='b')}${B('Filters & sort',"show('Name, level, Energy, Affection, Fertility and existing eligibility filters.')")}</article>${mode==='b'?`<aside class="hero extraHero">${portrait(p,'Candidate')}</aside>`:''}${detail}</section>`}
function support(){const x=M.items[itemIndex],q=M.supportQuotes[x.itemId][supportTarget],size=mode==='a'?6:4,art=i=>`/images/ui/apothecary-v1/${i.itemId.replaceAll('_','-')}.webp`;const cards=M.items.slice(itemPage*size,itemPage*size+size).map((i,j)=>{const n=itemPage*size+j;return mode==='a'?`<button class="tile" aria-pressed="${n===itemIndex}" onclick="item(${n})"><img src="${art(i)}" alt="${E(i.name)}"><strong>${E(i.name)}</strong><small>Owned ×${i.count}</small></button>`:`<button aria-pressed="${n===itemIndex}" onclick="item(${n})"><img src="${art(i)}" alt="${E(i.name)}"><span><strong>${E(i.name)}</strong><small>${i.category}</small></span><small>×${i.count}</small></button>`;}).join('');return `<section class="workspace gallery" data-focus="${focus}"><article class="panel" data-pane="lead"><div class="kicker">Shared inventory · Breeding entry</div><h2>Available supplies</h2><div class="sectionTabs">${['All','Energy','Care','Breeding'].map(t=>B(t,`show('${t} supplies use the existing catalogue and owned stock.')`)).join('')}</div><div class="${mode==='a'?'grid':'list'}">${cards}</div><div class="pager">${B('‹ Previous',"itemPage=Math.max(0,itemPage-1);render()",'',itemPage===0)}<span>${itemPage+1} / ${Math.ceil(M.items.length/size)} · 8 items</span>${B('Next ›',"itemPage=Math.min(1,itemPage+1);render()",'',itemPage===1)}</div><footer class="actions">${B('Armed effects · 0',"show('Armed effects, charges and next-attempt rules stay visible.')")}${B('Full inventory',"show('Opens the shared inventory with all categories and the same owned stock.')")}</footer></article><article class="panel" data-pane="detail"><h2>${E(x.name)}</h2><img class="itemArt" src="${art(x)}" alt="${E(x.name)}"><div class="row"><span>Owned</span><strong>×${x.count}</strong></div><p class="note">${E(x.exactEffect)}</p>${x.target==='breeding-pair'?`<p class="note">Pair support · Arms the next valid attempt</p>`:x.target==='pregnancy'?`<p class="note warn">No active pregnancy is selected.</p>`:`<label>Recipient<select aria-label="Recipient" onchange="supportTarget=this.value;render()"><option value="${M.giver.participantId}" ${supportTarget===M.giver.participantId?'selected':''}>Rook · Giver</option><option value="${M.receiver.participantId}" ${supportTarget===M.receiver.participantId?'selected':''}>Mira · Receiver</option></select></label>`}<p class="muted">Applies to: ${{'breeding-pair':'the next valid pair','pregnancy':'an active pregnancy','creature':'one creature','player-or-creature':'the player or one creature'}[x.target]}. Review the exact effect before using.</p>${!q.ok?`<p class="note warn">${E(q.message)}</p>`:''}<footer class="actions">${B('Cancel',"show('Cancelled. No supplies were used.')")}${B('Review use',"show('Would open the exact-effect review. No item is used in this preview.')",'primary',!q.ok)}</footer></article></section>`}
function inheritance(){let body='';if(tab==='Stats')body=table(['Base stat','Rook','Mira'],Object.entries(STATS).map(([k,n])=>[n,`${M.giver.stats[k]} <small>${M.giver.statGrades[k]}</small>`,`${M.receiver.stats[k]} <small>${M.receiver.statGrades[k]}</small>`]));else if(tab==='Talents')body=`<div class="stats">${[['First check',`${M.inheritance.odds.first}%`],['Second if first succeeds',`${M.inheritance.odds.second}%`],['Mutation if slot remains',`${M.inheritance.odds.mutation}%`]].map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join('')}</div><div class="note">Conditional checks, not guaranteed talent inheritance. Guard Dog remains canine-specific.</div>${M.giver.abilities.map(t=>`<div class="row"><span>${E(t.name)}</span><strong>Grade ${t.grade}</strong></div>`).join('')}`;else if(tab==='Moves')body=M.inheritance.moves.directCandidates.map(t=>`<div class="inset"><h3>${E(t.moveName)} · ${t.finalChance}%</h3><p>Compatible parent move · Separate pregnancy check</p></div>`).join('')+`<p class="note">Native starting moves remain guaranteed by species rules. Bonus moves and combinations are possible outcomes only.</p>`;else body=`<h3>Possible offspring family</h3><p class="note">Family follows the existing receiver and offspring compatibility rules. No offspring stats or traits are rolled by viewing this window.</p>`;const left=mode==='a'?`<article class="panel" data-pane="lead"><h2>Selected parents</h2>${pair()}<p class="note">Rook × Mira · Creature-to-creature pair</p><div class="note good">Parent records can be compared before conception.</div><p>Offspring values remain <strong>unknown until conception</strong>.</p>${B('Inspect parents',"go('inspect')")}</article>`:`<article class="panel" data-pane="lead"><h2>Lineage book</h2><div class="tree"><div class="branches"><div class="node">Rook<br><small>Giver · Canine</small></div><div class="node">Mira<br><small>Receiver · Feline</small></div></div><div class="line"></div><div class="node">Possible offspring<br><small>Not conceived · No traits rolled</small></div></div><p class="note">Permanent records are stored only after the existing conception and hatch flows.</p></article>`;return `<section class="workspace equal" data-focus="${focus}">${left}<article class="panel" data-pane="detail"><div class="kicker">Possible inheritance · Read only</div><h2>Compare inheritance</h2>${tabs(['Stats','Talents','Moves','Family'])}<div class="content">${body}</div><p class="muted">Current parent base stats and innate grades; equipment excluded. These are not promised hatchling values.</p>${pager('Focused inheritance record')}</article></section>`}
function options(){const cards=[['Swap roles','Both parents must support their new role. Selection spends nothing.','Swap roles'],['Random eligible pair','Choose from current eligible creatures. Does not run an attempt.','Choose pair'],['Clear pair','Remove both selections. Creatures and saved attempts remain.','Clear selections'],['Result presentation','Full Scenes or Quick Results. This device preference changes presentation only.','Quick / Full']];return `<section class="workspace ${mode==='b'?'':'equal'}" data-focus="${focus}"><article class="panel" data-pane="lead"><h2>Pair tools</h2><div class="optionGrid">${cards.map(([h,p,b])=>`<section class="optionCard"><h3>${h}</h3><p>${p}</p>${B(b,`show('${h}: preview only. The live pair and preferences are unchanged.')`,h==='Clear pair'?'':'primary')}</section>`).join('')}</div></article><article class="panel" data-pane="detail"><h2>Current pairing desk</h2>${mini(M.giver,'Giver')}${mini(M.receiver,'Receiver')}<div class="note">Pair tools change selection or result presentation. Attempt costs are committed only through Review attempt.</div><div class="row"><span>Result mode</span><strong>Quick Results</strong></div>${B('Return to pair',"show('Returns to the same selected pair.')")}</article></section>`}
function chance(){const rows=[['Base chance',M.preview.baseChance],['Pair familiarity',M.preview.streakBonus],['Affection',M.preview.affectionBonus],['Combined Fertility',Math.floor((M.giver.stats.FER+M.receiver.stats.FER)/3)],['Combined Charm',Math.floor((M.giver.stats.CHA+M.receiver.stats.CHA)/6)],['Talents, facility & daily effects',M.preview.abilityBonus]];const detail=tab==='Costs'?costs():tab==='Readiness'?`<div class="note good">Rook: ready.<br>Mira: ready.<br>Mira can become pregnant if the roll succeeds.</div><p class="note">The selected pair can attempt. Chance, resource blockers and pregnancy restrictions remain separate checks.</p>`:table(['Contribution','Chance'],rows.map(([name,n])=>[name,`${n>0?'+':''}${n}%`]));return `<section class="workspace chanceLayout" data-focus="${focus}"><article class="panel" data-pane="lead"><div class="kicker">Live calculation · Frozen preview</div><h2>Chance breakdown</h2>${tabs(['Chance','Readiness','Costs'])}<div class="content">${detail}</div>${pager('Complete notes remain paged')}</article><article class="panel" data-pane="detail"><h2>Pair readiness</h2>${mode==='b'?pair():''}<div class="vital"><img src="/images/ui/breeding-desk-a/icons/heart.webp" alt=""><strong class="chance">${M.preview.pregnancyChance}%</strong></div><p>Pregnancy chance · Rook × Mira</p><div class="readinessGrid"><div class="metric"><small>Energy each</small><strong>${M.preview.energyCost}</strong></div><div class="metric"><small>Hearts each</small><strong>${M.preview.heartCost}</strong></div></div><p class="note good">The pair is ready to review.</p>${mode==='a'?`<p class="note">Pregnancy and talent/move inheritance use separate checks. Viewing never rolls an outcome.</p>`:''}${B('Review attempt',"go('review')",'primary')}</article></section>`}
function review(){const warning=`<p class="note warn">Resource warning: Mira would spend more than half her current Energy. Review the low-resource warning before continuing.</p>`;const panel=`<article class="panel ${mode==='a'?'reviewCenter':''}" data-pane="detail"><div class="kicker">Exact costs · Nothing spent yet</div><h2>Review attempt · Rook × Mira</h2>${mode==='a'?`<div class="parentPair reviewParents">${[M.giver,M.receiver].map((p,i)=>`<div class="miniParent">${img(p)?`<img src="${img(p)}" alt="${E(p.displayName)} profile">`:`<span class="playerBadge">Rancher</span>`}<div><small>${i?'Receiver':'Giver'}</small><h3>${E(p.displayName)}</h3><small>Level ${p.level} · Ready</small></div></div>`).join('')}</div>`:''}${costs()}<div class="row"><span>Pregnancy chance</span><strong>${M.preview.pregnancyChance}%</strong></div>${warning}<p class="muted">Cancel changes nothing. Confirm rechecks the current pair and resources before spending anything.</p>${actions('Confirm attempt',"show('Would open the resource warning. This design preview cannot run an attempt or spend resources.')")}</article>`;return mode==='a'?`<section class="workspace single" data-focus="details">${panel}</section>`:`<section class="workspace equal" data-focus="${focus}"><article class="panel" data-pane="lead"><h2>Selected parents</h2>${pair()}<p class="note">Rook and Mira remain selected while you review or cancel.</p><div class="vital"><img src="/images/ui/breeding-desk-a/icons/heart.webp" alt=""><strong class="chance">11%</strong></div><p>Pregnancy chance</p></article>${panel}</section>`}
function ledger(){const a=M.attempt;const outcome=a?.outcome==='pregnancy'?'Pregnancy':'No pregnancy';const summary=`<div class="summaryStrip">${[['Sessions',1],['Pregnancies',a?.outcome==='pregnancy'?1:0],['Tracked pair',1],['Offspring',0]].map(([l,v])=>`<div class="metric"><small>${l}</small><strong>${v}</strong></div>`).join('')}</div>`;let rows=tab==='Pairs'?table(['Pair','Sessions','Action'],[['Rook × Mira','1',B('Details',"show('Pair details retain role order, dates and familiarity.')")]]):tab==='Creatures'?table(['Creature','Sessions','Action'],[['Rook','1',B('Use in Pen',"show('Restores the participant in a draft selection only.')")],['Mira','1',B('Family tree',"setTab('Tree')")]]):tab==='Tree'?`<div class="tree"><div class="node">Rook<br><small>Generation 1 · Parents not recorded</small></div><div class="line"></div><div class="node">No tracked offspring</div></div>`:tab==='Overview'?summary+`<p class="note">One engine-generated sample record is shown for design review. These are not your live ranch totals.</p>`:table(['Day','Pair','Outcome'],[['1','Rook × Mira',outcome]]);return `<section class="workspace ${mode==='b'?'equal':''}" data-focus="${focus}"><article class="panel" data-pane="lead"><div class="kicker">Permanent records · Sample history</div><h2>Breeding records</h2>${tabs(['Overview','Attempts','Pairs','Creatures','Tree'])}${mode==='a'?summary:''}<input aria-label="Search records" placeholder="Search parent, pair or recorded outcome" oninput="show('Search and filters operate on recorded attempts, never future outcomes.')"><div class="content">${rows}</div>${pager('1 / 1 · Example record')}${B('Filters & sort',"show('Outcome, participant, role and newest/oldest filters remain available.')")}</article><article class="panel" data-pane="detail"><h2>${mode==='a'?'Selected attempt':'Record dossier'}</h2>${mode==='b'?portrait(M.receiver,'Recorded receiver'):mini(M.receiver,'Recorded receiver')}<h3>Rook × Mira</h3><div class="row"><span>Outcome</span><strong>${outcome}</strong></div><div class="row"><span>Costs already paid</span><strong>53 Energy · 1 Heart each</strong></div><p class="note">Historical record. Viewing or restoring a pair spends nothing and never rerolls the outcome.</p><div class="actions">${B('Record details',"show('Complete recorded costs, progression and care history stay available.')")}${B('Use this pair',"show('Restores the recorded giver/receiver order. Does not perform an attempt.')",'primary')}</div></article></section>`}
function render(){document.body.className=`mode-${mode}`;document.getElementById('app').innerHTML=`<div class="shell ${hideArt?'hideArt':''}"><header class="header">${B('← Back',"show('Returns to the same Breeding Pen pair and source window.')")}<h1>${titles[win]}</h1><div class="context">${mode==='a'?'A · Compact workbench':'B · Roomy dossier'}<br><small>Connected Breeding Pen windows</small></div>${win==='inspect'?B(hideArt?'Expand profile':'Minimize profile',"hideArt=!hideArt;render()",'artToggle'):''}</header><nav class="mobileFocus"><button aria-pressed="${focus==='overview'}" onclick="view('overview')">Overview / Browse</button><button aria-pressed="${focus==='details'}" onclick="view('details')">Selected / Details</button></nav>${({inspect,change,support,inheritance,options,chance,review,ledger})[win]()}<footer class="footer"><p>DESIGN REVIEW · Sample values · No gameplay writes</p>${B(mode==='a'?'Compare layout B':'Compare layout A',"document.getElementById('mode').value=mode==='a'?'b':'a';mode=mode==='a'?'b':'a';render()")}</footer></div>`}
document.getElementById('windowSelect').innerHTML=Object.entries(labels).map(([id,name])=>`<option value="${id}">${name}</option>`).join('');document.getElementById('mode').onchange=e=>{mode=e.target.value;render()};document.getElementById('windowSelect').onchange=e=>go(e.target.value);fetch('model.json').then(r=>r.json()).then(m=>{M=m;const q=new URLSearchParams(location.search);mode=q.get('layout')==='b'?'b':'a';document.getElementById('mode').value=mode;go(titles[q.get('window')]?q.get('window'):'inspect')});
</script></body></html>
