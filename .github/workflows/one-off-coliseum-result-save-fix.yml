name: One-off Coliseum result save correction

on:
  push:
    branches:
      - agent/chapter-one-guided-onboarding

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chapter-one-guided-onboarding
          fetch-depth: 0
      - name: Restore result save properties
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/features/coliseum/ColiseumProgressionScreen.tsx")
          source = path.read_text(encoding="utf-8")
          if "result.activeSave" not in source:
              raise SystemExit("Expected result.activeSave occurrences were not found")
          path.write_text(source.replace("result.activeSave", "result.save"), encoding="utf-8")
          Path(".github/workflows/one-off-coliseum-result-save-fix.yml").unlink(missing_ok=True)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/coliseum/ColiseumProgressionScreen.tsx .github/workflows/one-off-coliseum-result-save-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "Restore Coliseum result save properties"
          git push origin HEAD:agent/chapter-one-guided-onboarding
