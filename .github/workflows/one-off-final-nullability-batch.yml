name: One-off final nullability batch

on:
  push:
    branches:
      - agent/chapter-one-guided-onboarding

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chapter-one-guided-onboarding
          fetch-depth: 0
      - name: Fix remaining strict-null closure errors
        shell: python
        run: |
          from pathlib import Path
          import re

          ranch_path = Path("src/features/ranch/RanchHubScreenDayLoop.tsx")
          ranch = ranch_path.read_text(encoding="utf-8")
          ranch_marker = '  if (!save) return <BaseRanchHubScreen />;'
          if ranch_marker not in ranch:
              raise SystemExit("Expected Ranch Day save guard was not found")
          before, after = ranch.split(ranch_marker, 1)
          if "  const activeSave = save;" not in after:
              after = re.sub(r"(?<!\.)\bsave\b", "activeSave", after)
              ranch = before + ranch_marker + "\n  const activeSave = save;" + after
              ranch_path.write_text(ranch, encoding="utf-8")

          tutorial_path = Path("src/features/tutorial/ChapterOneGuidedTutorial.tsx")
          tutorial = tutorial_path.read_text(encoding="utf-8")
          tutorial_marker = '  if (!currentSave || !step) return null;'
          if tutorial_marker not in tutorial:
              raise SystemExit("Expected Chapter 1 tutorial guard was not found")
          before, after = tutorial.split(tutorial_marker, 1)
          if "  const activeSave = currentSave;" not in after:
              after = re.sub(r"\bcurrentSave\b", "activeSave", after)
              after = re.sub(r"\bstep\b", "activeStep", after)
              tutorial = before + tutorial_marker + "\n  const activeSave = currentSave;\n  const activeStep = step;" + after
              tutorial_path.write_text(tutorial, encoding="utf-8")

          Path(".github/workflows/one-off-final-nullability-batch.yml").unlink(missing_ok=True)
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/ranch/RanchHubScreenDayLoop.tsx src/features/tutorial/ChapterOneGuidedTutorial.tsx .github/workflows/one-off-final-nullability-batch.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix final Chapter 1R strict-null closures"
          git push origin HEAD:agent/chapter-one-guided-onboarding
