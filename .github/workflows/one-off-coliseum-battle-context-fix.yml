name: One-off Coliseum battle context correction

on:
  push:
    branches:
      - agent/chapter-one-guided-onboarding

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chapter-one-guided-onboarding
          fetch-depth: 0
      - name: Correct nested battle context destructuring
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/features/coliseum/ColiseumProgressionScreen.tsx")
          source = path.read_text(encoding="utf-8")
          old = '  const { save, goToBattleOutfitter, saveCurrentGame } = useGameContext();'
          new = '  const { currentSave, goToBattleOutfitter, saveCurrentGame } = useGameContext();\n  const save = currentSave;'
          if old not in source:
              raise SystemExit("Expected nested Coliseum context line was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/one-off-coliseum-battle-context-fix.yml").unlink(missing_ok=True)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/coliseum/ColiseumProgressionScreen.tsx .github/workflows/one-off-coliseum-battle-context-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "Correct Coliseum battle context narrowing"
          git push origin HEAD:agent/chapter-one-guided-onboarding
