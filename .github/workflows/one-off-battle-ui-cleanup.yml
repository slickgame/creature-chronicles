name: One-off battle UI cleanup

on:
  push:
    branches:
      - agent/battle-ui-cleanup-pass

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/battle-ui-cleanup-pass
          fetch-depth: 0
      - name: Apply command HUD cleanup
        shell: python
        run: |
          from pathlib import Path

          css_path = Path("src/features/battle/BattleArenaScreen.module.css")
          css = css_path.read_text()
          marker = "/* Battle UI cleanup pass */"
          cleanup_css = r'''

/* Battle UI cleanup pass */
.frame {
  width: min(1740px, 100%);
  gap: 10px;
  padding: 12px;
}

.header h1 {
  font-size: clamp(1.65rem, 2.5vw, 2.25rem);
}

.commandDeck {
  display: grid;
  grid-template-columns: minmax(0, 2.1fr) minmax(310px, 0.82fr);
  grid-template-areas:
    "action queue"
    "action log";
  align-items: start;
  gap: 12px;
}

.actionPanel {
  grid-area: action;
  min-height: 300px;
  padding: 14px;
  gap: 12px;
}

.queuePanel {
  grid-area: queue;
  max-height: 214px;
  padding: 12px;
}

.logPanel {
  grid-area: log;
  max-height: 196px;
  padding: 12px;
}

.actionPanel > .panelHeading {
  align-items: stretch;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid rgba(244, 193, 95, 0.22);
  border-radius: 10px;
  background: rgba(12, 17, 22, 0.62);
}

.actionPanel > .panelHeading > div {
  min-width: 0;
  flex: 1;
}

.panelHeading span {
  font-size: 0.72rem;
}

.panelHeading strong {
  font-size: 1rem;
}

.moveGrid {
  overflow: visible;
  gap: 10px;
}

.moveButton {
  min-height: 96px;
  padding: 12px;
  gap: 7px;
  border-radius: 11px;
}

.moveTitle strong {
  font-size: 1rem;
}

.moveTitle em,
.moveButton > span:not(.moveTitle),
.moveButton small {
  font-size: 0.78rem;
}

.emptyMoveState,
.resultPanel {
  min-height: 210px;
  padding: 24px;
}

.emptyMoveState strong,
.resultPanel h2 {
  font-size: 1.2rem;
}

.queueList,
.logList {
  gap: 6px;
}

.queueEntry {
  padding: 8px 9px;
}

.queueEntry strong {
  font-size: 0.86rem;
}

.queueEntry span,
.logList p,
.statusLine,
.queuedLine {
  font-size: 0.76rem;
}

.confirmButton {
  min-height: 44px;
  font-size: 0.92rem;
}

.supportDrawer {
  margin-top: 2px;
  overflow: hidden;
  border: 1px solid rgba(245, 201, 128, 0.24);
  border-radius: 10px;
  background: rgba(8, 13, 18, 0.7);
}

.supportDrawer summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 42px;
  padding: 9px 11px;
  cursor: pointer;
  list-style: none;
  color: #fff0ca;
}

.supportDrawer summary::-webkit-details-marker {
  display: none;
}

.supportDrawer summary span {
  color: #d5ad65;
  font-size: 0.72rem;
  font-weight: 900;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.supportDrawer summary strong {
  min-width: 0;
  overflow: hidden;
  color: #e7e1d6;
  font-size: 0.78rem;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.supportDrawer summary::after {
  content: "Show";
  flex: 0 0 auto;
  color: #8fd9b1;
  font-size: 0.7rem;
  font-weight: 900;
}

.supportDrawer[open] summary::after {
  content: "Hide";
}

.supportDrawer > p,
.supportDrawer > div {
  margin: 0 11px 10px;
}

.supportDrawer .cardActions button {
  min-height: 34px;
}

@media (max-width: 1100px) {
  .commandDeck {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas:
      "action action"
      "queue log";
  }

  .queuePanel,
  .logPanel {
    max-height: 230px;
  }
}

@media (max-width: 800px) {
  .frame { padding: 8px; }
  .commandDeck {
    min-height: 0;
    grid-template-columns: 1fr;
    grid-template-areas:
      "action"
      "queue"
      "log";
  }

  .actionPanel,
  .queuePanel,
  .logPanel {
    max-height: none;
  }

  .moveGrid {
    grid-template-columns: 1fr;
  }

  .moveButton {
    min-height: 84px;
  }

  .supportDrawer summary {
    align-items: flex-start;
    flex-wrap: wrap;
  }
}
'''
          if marker not in css:
              css_path.write_text(css.rstrip() + cleanup_css + "\n")

          c2_path = Path("src/features/coliseum/ColiseumC2Screen.tsx")
          c2 = c2_path.read_text().replace("battleState.log.slice(-24)", "battleState.log.slice(-6)")
          old_c2 = '''            <section style={{ ...darkPanel, marginTop: 12, padding: 12 }} data-ui-text-box="auto">
              <div className={battleStyles.panelHeading}><div><span>Battle Outfitter</span><strong>Support Items</strong></div></div>
              <p className={battleStyles.statusLine}>Each item type may be used once in this match.</p>
              <div className={battleStyles.cardActions}><button type="button" onClick={() => useSupportItem("tonic")} disabled={usedItems.fieldTonic || tonicStock <= 0 || phase === "result"}>Field Tonic ({tonicStock})</button><button type="button" onClick={() => useSupportItem("revival")} disabled={usedItems.revivalSalve || revivalStock <= 0}>Revival Salve ({revivalStock})</button></div>
            </section>'''
          new_c2 = '''            <details className={battleStyles.supportDrawer}>
              <summary><span>Support Items</span><strong>Optional · Tonic {tonicStock} · Revival {revivalStock}</strong></summary>
              <p className={battleStyles.statusLine}>Each item type may be used once in this match. Select an allied creature before using an item.</p>
              <div className={battleStyles.cardActions}><button type="button" onClick={() => useSupportItem("tonic")} disabled={usedItems.fieldTonic || tonicStock <= 0 || phase === "result"}>Field Tonic ({tonicStock})</button><button type="button" onClick={() => useSupportItem("revival")} disabled={usedItems.revivalSalve || revivalStock <= 0}>Revival Salve ({revivalStock})</button></div>
            </details>'''
          if old_c2 not in c2:
              raise SystemExit("C2 support-item block not found")
          c2_path.write_text(c2.replace(old_c2, new_c2))

          c4_path = Path("src/features/coliseum/ColiseumC4Battle.tsx")
          c4 = c4_path.read_text().replace("battleState.log.slice(-24)", "battleState.log.slice(-6)")
          old_c4 = '''            <section className={styles.supportPanel} data-ui-text-box="auto">
              <div className={battleStyles.panelHeading}><div><span>Battle Outfitter</span><strong>Support Items</strong></div></div>
              <p className={battleStyles.statusLine}>{aidRestricted ? "Restricted Aid is active. Field Tonics and Revival Salves are disabled." : "Each item type may be used once during this stage."}</p>
              <div className={battleStyles.cardActions}><button type="button" onClick={() => useSupportItem("tonic")} disabled={aidRestricted || usedItems.fieldTonic || tonicStock <= 0 || phase === "result"}>Field Tonic ({tonicStock})</button><button type="button" onClick={() => useSupportItem("revival")} disabled={aidRestricted || usedItems.revivalSalve || revivalStock <= 0}>Revival Salve ({revivalStock})</button></div>
            </section>'''
          new_c4 = '''            <details className={battleStyles.supportDrawer}>
              <summary><span>Support Items</span><strong>{aidRestricted ? "Restricted Aid active" : `Optional · Tonic ${tonicStock} · Revival ${revivalStock}`}</strong></summary>
              <p className={battleStyles.statusLine}>{aidRestricted ? "Restricted Aid is active. Field Tonics and Revival Salves are disabled." : "Each item type may be used once during this stage. Select an allied creature before using an item."}</p>
              <div className={battleStyles.cardActions}><button type="button" onClick={() => useSupportItem("tonic")} disabled={aidRestricted || usedItems.fieldTonic || tonicStock <= 0 || phase === "result"}>Field Tonic ({tonicStock})</button><button type="button" onClick={() => useSupportItem("revival")} disabled={aidRestricted || usedItems.revivalSalve || revivalStock <= 0}>Revival Salve ({revivalStock})</button></div>
            </details>'''
          if old_c4 not in c4:
              raise SystemExit("C4 support-item block not found")
          c4_path.write_text(c4.replace(old_c4, new_c4))

          Path(".github/workflows/one-off-battle-ui-cleanup.yml").unlink()
      - name: Commit cleanup patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up battle command interface"
          git push origin HEAD:agent/battle-ui-cleanup-pass
