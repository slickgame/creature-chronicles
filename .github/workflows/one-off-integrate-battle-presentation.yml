name: One-off integrate battle presentation

on:
  push:
    branches:
      - agent/battle-presentation-vertical-slice

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/battle-presentation-vertical-slice
          fetch-depth: 0
      - name: Wire portrait stage into active Coliseum battles
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def integrate(path_string, state_message, challenge=False):
              path = Path(path_string)
              text = path.read_text(encoding="utf-8")

              engine_import = 'import { createBattleState, getEffectiveBattleStats, resolveBattleRound } from "@/data/battleEngine";'
              if challenge:
                  engine_import = '''import {
            createBattleState,
            getEffectiveBattleStats,
            resolveBattleRound,
          } from "@/data/battleEngine";'''
              presentation_import = engine_import + '\nimport { buildBattlePresentationEvents } from "@/data/battlePresentation";'
              text = replace_once(text, engine_import, presentation_import, f"{path.name} engine import")

              styles_import = 'import battleStyles from "@/features/battle/BattleArenaScreen.module.css";'
              styles_replacement = styles_import + '\nimport { BattlePortraitStage } from "@/features/battle/BattlePortraitStage";\nimport { useBattlePresentationController } from "@/features/battle/useBattlePresentationController";'
              text = replace_once(text, styles_import, styles_replacement, f"{path.name} battle imports")

              message_line = state_message
              text = replace_once(text, message_line, message_line + '\n  const presentation = useBattlePresentationController();', f"{path.name} presentation state")

              resolve_line = '    const resolved = resolveBattleRound(stateWithAiPlan, [...Array.from(queuedActions.values()), ...aiPlan.actions]);'
              resolve_replacement = resolve_line + '\n    presentation.play(buildBattlePresentationEvents(battleState, resolved.state, resolved.result));'
              text = replace_once(text, resolve_line, resolve_replacement, f"{path.name} round presentation")

              text = text.replace(
                  'if (!battleState || !activeActorId || !selectedTarget) return;',
                  'if (presentation.isPlaying || !battleState || !activeActorId || !selectedTarget) return;',
                  1,
              )
              text = text.replace(
                  'if (!battleState || battleState.combatants[actorId]?.isFainted) return;',
                  'if (presentation.isPlaying || !battleState || battleState.combatants[actorId]?.isFainted) return;',
                  1,
              )
              text = text.replace(
                  'if (!battleState) return;\n    const nextQueue = new Map(queuedActions);',
                  'if (presentation.isPlaying || !battleState) return;\n    const nextQueue = new Map(queuedActions);',
                  1,
              )
              if challenge:
                  text = text.replace(
                      'if (aidRestricted) { setMessage("Restricted Aid prevents Field Tonics and Revival Salves in this challenge."); return; }',
                      'if (presentation.isPlaying) return;\n    if (aidRestricted) { setMessage("Restricted Aid prevents Field Tonics and Revival Salves in this challenge."); return; }',
                      1,
                  )
              else:
                  text = text.replace(
                      'if (!battleState || selectedTarget?.kind !== "combatant") { setMessage("Select a ranch-team creature before using a support item."); return; }',
                      'if (presentation.isPlaying) return;\n    if (!battleState || selectedTarget?.kind !== "combatant") { setMessage("Select a ranch-team creature before using a support item."); return; }',
                      1,
                  )
              text = text.replace(
                  'if (!battleState || !allPlayerActionsQueued) { setMessage("Queue one action for every living ranch creature."); return; }',
                  'if (presentation.isPlaying || !battleState || !allPlayerActionsQueued) { setMessage("Queue one action for every living ranch creature."); return; }',
                  1,
              )

              stage = '''
                <BattlePortraitStage
                  battleState={battleState}
                  sourceById={sourceById}
                  selectedTarget={selectedTarget}
                  activeActorId={activeActorId}
                  queuedActions={queuedActions}
                  activeEvent={presentation.activeEvent}
                  isResolving={presentation.isPlaying}
                  queuedEventCount={presentation.queuedEventCount}
                  speed={presentation.speed}
                  reducedMotion={presentation.reducedMotion}
                  onSpeedChange={presentation.setSpeed}
                  onReducedMotionChange={presentation.setReducedMotion}
                  onTarget={(combatantId) => setSelectedTarget({ kind: "combatant", combatantId })}
                  onPlan={planFor}
                  onFieldTarget={() => setSelectedTarget({ kind: "field" })}
                />'''
              battlefield_pattern = re.compile(
                  r'\n        <section className=\{battleStyles\.battlefield\}>.*?\n        </section>\n\n        <section className=\{battleStyles\.commandDeck\}>',
                  re.S,
              )
              text, count = battlefield_pattern.subn(stage + '\n\n        <section className={battleStyles.commandDeck}>', text, count=1)
              if count != 1:
                  raise SystemExit(f"{path.name}: battlefield block replacement found {count}")

              text = text.replace(
                  'disabled={!allPlayerActionsQueued || phase === "result"}',
                  'disabled={presentation.isPlaying || !allPlayerActionsQueued || phase === "result"}',
                  1,
              )

              path.write_text(text, encoding="utf-8")

          integrate(
              "src/features/coliseum/ColiseumC2Screen.tsx",
              '  const [message, setMessage] = useState("Choose an unlocked authored opponent. Recorded matches now grant combat XP and persistent creature battle records.");',
              False,
          )
          integrate(
              "src/features/coliseum/ColiseumC4Battle.tsx",
              '  const [message, setMessage] = useState(`Choose exactly three available creatures for ${challenge.name}.`);',
              True,
          )

          Path(".github/workflows/one-off-integrate-battle-presentation.yml").unlink(missing_ok=True)
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add src/features/coliseum/ColiseumC2Screen.tsx src/features/coliseum/ColiseumC4Battle.tsx .github/workflows/one-off-integrate-battle-presentation.yml
          git diff --cached --quiet && exit 0
          git commit -m "Integrate portrait battle presentation"
          git push origin HEAD:agent/battle-presentation-vertical-slice
