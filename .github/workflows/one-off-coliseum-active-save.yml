name: One-off nested Coliseum active save

on:
  push:
    branches:
      - agent/chapter-one-guided-onboarding

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chapter-one-guided-onboarding
          fetch-depth: 0
      - name: Preserve nested save narrowing in closures
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/features/coliseum/ColiseumProgressionScreen.tsx")
          source = path.read_text(encoding="utf-8")
          marker = "  if (!save) return null;"
          if marker not in source:
              raise SystemExit("Expected nested Coliseum save guard was not found")
          before, after = source.split(marker, 1)
          if "  const activeSave = save;" not in after:
              after = re.sub(r"\bsave\b", "activeSave", after)
              source = before + marker + "\n  const activeSave = save;" + after
              path.write_text(source, encoding="utf-8")

          Path(".github/workflows/one-off-coliseum-active-save.yml").unlink(missing_ok=True)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/coliseum/ColiseumProgressionScreen.tsx .github/workflows/one-off-coliseum-active-save.yml
          git diff --cached --quiet && exit 0
          git commit -m "Preserve nested Coliseum save narrowing"
          git push origin HEAD:agent/chapter-one-guided-onboarding
