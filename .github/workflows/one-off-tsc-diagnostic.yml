name: One-off full TypeScript diagnostic

on:
  push:
    branches:
      - agent/chapter-one-guided-onboarding

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chapter-one-guided-onboarding
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture complete strict TypeScript diagnostics
        run: |
          mkdir -p docs/testing
          npx tsc --noEmit --pretty false > docs/testing/chapter-one-guided-tsc-errors.txt 2>&1 || true
          if [ ! -s docs/testing/chapter-one-guided-tsc-errors.txt ]; then
            echo "TYPECHECK_CLEAN" > docs/testing/chapter-one-guided-tsc-errors.txt
          fi
          rm .github/workflows/one-off-tsc-diagnostic.yml
      - name: Commit diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/testing/chapter-one-guided-tsc-errors.txt .github/workflows/one-off-tsc-diagnostic.yml
          git commit -m "Capture full Chapter 1R TypeScript diagnostics"
          git push origin HEAD:agent/chapter-one-guided-onboarding
