name: One-off Chapter 1R branch patch

on:
  push:
    branches:
      - agent/chapter-one-guided-onboarding

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chapter-one-guided-onboarding
          fetch-depth: 0
      - name: Apply exact C4 save narrowing patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/features/coliseum/ColiseumC4Battle.tsx")
          source = path.read_text(encoding="utf-8")
          marker = "  if (!currentSave) return null;"
          if marker not in source:
              raise SystemExit("Expected C4 save guard was not found")
          before, after = source.split(marker, 1)
          if "  const save = currentSave;" not in after:
              after = after.replace("currentSave", "save")
              source = before + marker + "\n  const save = currentSave;" + after
              path.write_text(source, encoding="utf-8")

          workflow = Path(".github/workflows/one-off-chapter1r-patch.yml")
          workflow.unlink(missing_ok=True)
      - name: Commit branch patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/coliseum/ColiseumC4Battle.tsx .github/workflows/one-off-chapter1r-patch.yml
          git diff --cached --quiet && exit 0
          git commit -m "Narrow active save in Coliseum C4 battle"
          git push origin HEAD:agent/chapter-one-guided-onboarding
